<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lighting — LEGO Train Control</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
  body{margin:0;background:#17161B;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background-color:#17161B;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1.3px, transparent 1.4px);background-size:26px 26px;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:30px 22px 18px 22px;flex-shrink:0;">
    <div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.01em;">Lighting</div>
      <div style="font-size:12.5px;color:#9C97A6;margin-top:3px;">2 circuits</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;padding:6px 11px;background:rgba(255,255,255,0.05);border-radius:20px;">
      <span style="width:6px;height:6px;border-radius:50%;background:#4C9A6B;display:inline-block;"></span>
      <span style="font-size:11.5px;color:#B7B2BE;font-weight:500;">Online</span>
    </div>
  </div>

  <div style="flex:1 1 auto;overflow-y:auto;padding:0 20px 24px 20px;display:flex;flex-direction:column;gap:14px;">

    <div style="background:#211F26;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:11px;">
          <div style="width:34px;height:34px;border-radius:9px;background:rgba(242,194,48,0.15);color:{{accent}};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.1v.2h6v-.2c0-.9.4-1.6 1-2.1A7 7 0 0 0 12 2Z"></path></svg>
          </div>
          <div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">Station Lights</div>
            <div style="font-size:12px;color:#9C97A6;margin-top:1px;">GPIO 17</div>
          </div>
        </div>
        <div style="width:44px;height:26px;border-radius:13px;background:{{accent}};position:relative;flex-shrink:0;">
          <div style="position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#17161B;"></div>
        </div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;">
          <span style="font-size:12px;color:#9C97A6;">Brightness</span>
          <span style="font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;">70%</span>
        </div>
        <div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,0.09);">
          <div style="position:absolute;left:0;top:0;bottom:0;width:70%;border-radius:3px;background:{{accent}};"></div>
          <div style="position:absolute;left:70%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:{{accent}};border:3px solid #17161B;box-shadow:0 0 0 1px rgba(255,255,255,0.14);"></div>
        </div>
      </div>
    </div>

    <div style="background:#211F26;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:11px;">
          <div style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,0.06);color:#746F7D;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.1v.2h6v-.2c0-.9.4-1.6 1-2.1A7 7 0 0 0 12 2Z"></path></svg>
          </div>
          <div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:#B7B2BE;">Trackside Lamps</div>
            <div style="font-size:12px;color:#746F7D;margin-top:1px;">GPIO 27</div>
          </div>
        </div>
        <div style="width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,0.1);position:relative;flex-shrink:0;">
          <div style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8A8592;"></div>
        </div>
      </div>
      <div style="opacity:0.4;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;">
          <span style="font-size:12px;color:#9C97A6;">Brightness</span>
          <span style="font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;">—</span>
        </div>
        <div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,0.09);">
          <div style="position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:3px;background:#8A8592;"></div>
          <div style="position:absolute;left:0%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#8A8592;border:3px solid #17161B;"></div>
        </div>
      </div>
    </div>

    <button style="border:1.5px dashed rgba(255,255,255,0.18);border-radius:16px;background:transparent;color:#9C97A6;padding:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add a circuit
    </button>

  </div>

  <div style="display:flex;align-items:stretch;border-top:1px solid rgba(255,255,255,0.08);background:#1D1B22;padding:10px 10px 14px 10px;flex-shrink:0;">
    <a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:#746F7D;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path><path d="M5 12h14"></path><path d="M9 4V2h6v2"></path><path d="M8.5 16v2.6M15.5 16v2.6"></path></svg>
      <span style="font-size:10.5px;font-weight:600;">Railway</span>
    </a>
    <a href="Lighting.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:{{accent}};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.1v.2h6v-.2c0-.9.4-1.6 1-2.1A7 7 0 0 0 12 2Z"></path></svg>
      <span style="font-size:10.5px;font-weight:600;">Lighting</span>
    </a>
    <a href="Switches.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:#746F7D;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V12"></path><path d="M12 12 5 5"></path><path d="M12 12l7-7"></path></svg>
      <span style="font-size:10.5px;font-weight:600;">Switches</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C230","options":["#F2C230","#C41E2D","#0055BF","#4C9A6B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F2C230' };
  }
}
</script>
</body>
</html>
